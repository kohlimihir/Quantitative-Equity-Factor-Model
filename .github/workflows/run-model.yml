name: Run Equity Factor Model

on:
  push:
    branches: [ opus_test ]
  schedule:
    # Run on 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate code (syntax check)
      run: |
        python -m py_compile run_all.py
        python -m py_compile model.py
        python -m py_compile data_loader.py
        python -m py_compile app_cloud.py
        echo "✅ All Python files are valid"
    
    - name: Run model pipeline (if data exists)
      run: |
        if [ -f "data/daily_prices.parquet" ]; then
          echo "📊 Data found, running full pipeline..."
          python run_all.py --config clean_features
        else
          echo "⚠️ No cached data found. Skipping full pipeline run."
          echo "💡 To run the full pipeline, ensure data files are available."
          echo "✅ Code validation passed - workflow successful"
        fi
      env:
        PYTHONUNBUFFERED: 1
      continue-on-error: false
    
    - name: Upload results to Azure Blob Storage (if available)
      if: success() && hashFiles('data/ensemble_predictions.csv') != ''
      run: |
        pip install azure-storage-blob
        python upload_to_azure.py
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      continue-on-error: true
    
    - name: Upload artifacts (if available)
      if: hashFiles('data/ensemble_predictions.csv') != ''
      uses: actions/upload-artifact@v4
      with:
        name: model-outputs
        path: |
          data/ensemble_predictions.csv
          data/shap_values.csv
          data/ensemble_weights.csv
          reports/oot_validation_report.csv
          reports/feature_ic_summary.csv
          reports/turnover_optimized.csv
          reports/comprehensive_diagnostic_report.txt
        retention-days: 90
      continue-on-error: true
    
    - name: Create summary
      run: |
        echo "## Model Pipeline Validation" >> $GITHUB_STEP_SUMMARY
        echo "- Date: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: opus_test" >> $GITHUB_STEP_SUMMARY
        echo "- Config: clean_features" >> $GITHUB_STEP_SUMMARY
        echo "- Python: 3.11" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ✅ Code validation passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Notes" >> $GITHUB_STEP_SUMMARY
        echo "- Full pipeline requires data files (not in repo)" >> $GITHUB_STEP_SUMMARY
        echo "- Run locally with: \`python run_all.py --config clean_features\`" >> $GITHUB_STEP_SUMMARY
        echo "- Auto-uploads to Azure Blob Storage when run successfully" >> $GITHUB_STEP_SUMMARY
