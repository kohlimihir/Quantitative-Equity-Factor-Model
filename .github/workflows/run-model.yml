name: Run Equity Factor Model

on:
  push:
    branches: [ opus_test ]
  schedule:
    # Run on 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run model pipeline
      run: |
        python run_all.py --config optimized_low_turnover
      env:
        PYTHONUNBUFFERED: 1
    
    - name: Upload results to Azure Blob Storage
      run: |
        pip install azure-storage-blob
        python upload_to_azure.py
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: model-outputs
        path: |
          data/ensemble_optimize_predictions.csv
          data/shap_values.csv
          reports/oot_validation_report.csv
          reports/turnover_optimized.csv
          reports/feature_ic_summary.csv
          reports/comprehensive_diagnostic_report.txt
        retention-days: 90
    
    - name: Create summary
      run: |
        echo "## Model Run Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Date: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- Config: optimized_low_turnover" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ✅ Success" >> $GITHUB_STEP_SUMMARY
